  <style>
    :root {
      --canvas: #141618;
      --paper: rgba(28, 32, 37, 0.92);
      --paper-strong: #1b1f25;
      --ink: #eef2f5;
      --muted: #aab4bd;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #7cc7ff;
      --sans: "Segoe UI", "Trebuchet MS", ui-sans-serif, system-ui, sans-serif;
      --display: Bahnschrift, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      color-scheme: dark;
      font-family: var(--sans);
      background: var(--canvas);
      color: var(--ink);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #171a1e 0%, #111316 100%);
    }

    main {
      width: min(940px, calc(100vw - 40px));
      padding: 120px 0 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: var(--display);
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
    }

    p {
      margin: 0 0 32px;
      color: #c8d6e3;
      font-size: 1rem;
    }

    ul {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 18px;
      background: var(--paper);
      transition: background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      cursor: pointer;
    }

    li:hover,
    li:focus-within {
      border-color: rgba(124, 199, 255, 0.34);
      background: linear-gradient(180deg, rgba(124, 199, 255, 0.08), rgba(255, 255, 255, 0.03)), var(--paper);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24), 0 0 0 4px rgba(124, 199, 255, 0.05);
      transform: translateY(-1px);
    }

    a {
      color: var(--accent);
      font-size: 1.08rem;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .project-title {
      min-width: 0;
    }

    .project-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .project-links .icon-link {
      opacity: 0;
      pointer-events: none;
    }

    li:hover .project-links .icon-link,
    li:focus-within .project-links .icon-link {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      min-width: 42px;
      min-height: 42px;
      overflow: hidden;
      line-height: 1;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .icon-link:hover {
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .icon-link img {
      display: block;
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .site-footer {
      margin-top: 28px;
      padding-top: 8px;
      display: grid;
      gap: 16px;
    }

    .footer-separator {
      width: 100%;
      height: 1px;
      background: var(--line);
    }

    .footer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .footer-copy {
      color: #c8d6e3;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: end;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-link-icon {
      color: var(--muted);
    }

    .footer-link-icon:hover,
    .footer-link-icon:focus-visible {
      color: var(--ink);
    }

    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid rgba(124, 199, 255, 0.38);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(27, 31, 37, 0.9);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px) scale(0.92);
      transition: opacity 180ms ease, transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .back-to-top.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .back-to-top:hover {
      border-color: var(--accent);
      background: #252d36;
      transform: translateY(-2px);
    }

    .back-to-top:focus-visible {
      outline: 3px solid rgba(124, 199, 255, 0.44);
      outline-offset: 3px;
    }

    .back-to-top svg {
      width: 22px;
      height: 22px;
    }

    @media (max-width: 640px) {
      main {
        width: min(940px, calc(100% - 24px));
        padding: 32px 0 12px;
      }

      li,
      .footer-meta {
        align-items: flex-start;
        flex-direction: column;
      }

      li {
        gap: 14px;
        padding: 18px;
      }

      .project-title {
        font-size: 1rem;
      }

      .project-links {
        align-self: stretch;
        justify-content: flex-end;
      }

      .project-links .icon-link {
        opacity: 1;
        pointer-events: auto;
      }

      .site-footer {
        padding: 0;
        gap: 12px;
      }

      .footer-meta {
        width: 100%;
        gap: 14px;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.03);
      }

      .footer-links {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .footer-copy {
        width: 100%;
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.6;
        white-space: normal;
      }

      .footer-links .footer-link-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-width: 0;
        min-height: 42px;
        padding: 10px 12px;
        border-radius: 999px;
      }

      .footer-links .footer-link-icon:first-child {
        grid-column: 1 / -1;
      }

      .back-to-top {
        right: 16px;
        bottom: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }

  <script>
    for (const card of document.querySelectorAll("[data-href]")) {
      card.addEventListener("click", (event) => {
        if (event.target.closest("a")) {
          return;
        }

        window.location.href = card.dataset.href;
      });
    }

    const backToTop = document.querySelector(".back-to-top");
    const updateBackToTop = () => {
      backToTop.classList.toggle("is-visible", window.scrollY > 480);
    };

    window.addEventListener("scroll", updateBackToTop, {passive: true});
    updateBackToTop();
    backToTop.addEventListener("click", () => {
      window.scrollTo({top: 0, behavior: "smooth"});
    });
  </script>
